<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>SOMIR | Digital NFC Card</title>
<style>
:root{--bg:#050505;--card:#101010;--line:#262626;--text:#f6f6f6;--muted:#a5a5a5;--accent:#20d6c2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#171717 0%,#050505 52%);color:var(--text);font-family:Inter,Arial,sans-serif;display:flex;justify-content:center;padding:26px 15px 34px}
.wrap{width:100%;max-width:430px}
.card{overflow:hidden;border:1px solid #242424;border-radius:28px;background:linear-gradient(155deg,#151515,#090909 62%);box-shadow:0 24px 70px #0009}
.hero{padding:28px 22px 22px;text-align:center;position:relative}
.label{display:inline-flex;align-items:center;gap:8px;color:#d5d5d5;font-size:10px;letter-spacing:2.7px;text-transform:uppercase;border:1px solid #303030;border-radius:99px;padding:9px 13px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.avatar{width:190px;height:190px;border-radius:50%;object-fit:cover;object-position:center 42%;border:3px solid #303030;padding:4px;background:#090909;display:block;margin:23px auto 17px;box-shadow:0 0 0 1px #3b3b3b,0 12px 34px #000}
h1{font-size:32px;letter-spacing:4px;margin:0 0 7px;font-weight:800}
.subtitle{font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.divider{height:1px;background:linear-gradient(90deg,transparent,#333,transparent);margin:0 22px}
.content{padding:22px}
.section-title{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#888;margin:0 0 13px}
.links{display:grid;gap:10px}
.link{display:flex;align-items:center;gap:13px;text-decoration:none;color:var(--text);border:1px solid var(--line);background:#141414;border-radius:15px;padding:14px 15px;transition:transform .2s,border-color .2s}
.link:hover{transform:translateY(-2px);border-color:#555}
.icon{width:39px;height:39px;display:grid;place-items:center;border-radius:12px;background:#202020;font-size:17px;flex-shrink:0}
.linktext{flex:1;min-width:0}
.linktext strong{font-size:13px;display:block;margin-bottom:4px}
.linktext small{font-size:11px;color:#969696;overflow-wrap:anywhere}
.arrow{color:#777;font-size:18px}
.save{width:100%;margin-top:17px;border:0;border-radius:15px;padding:15px;background:var(--accent);color:#041311;font-size:13px;font-weight:800;letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
.save:hover{filter:brightness(1.07)}

footer{text-align:center;font-size:10px;color:#666;letter-spacing:1.5px;margin-top:18px}
@media(min-width:500px){body{padding-top:42px}}
</style>
</head>
